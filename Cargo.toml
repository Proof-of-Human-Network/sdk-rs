[package]
name        = "poh-sdk"
version     = "0.6.0"
edition     = "2021"
description = "Proof of Human SDK — scan wallets, poll async jobs, access signal methods"
license     = "MIT"
keywords    = ["proof-of-human", "identity", "solana", "wallet", "web3"]
categories  = ["api-bindings", "authentication"]
repository  = "https://github.com/proofofhuman/sdk-rs"

[dependencies]
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
urlencoding  = "2"
tokio        = { version = "1", features = ["time", "sync"], optional = true }
ed25519-dalek = { version = "2", optional = true, features = ["pkcs8", "pem"] }
sha2          = { version = "0.10", optional = true }
base64        = { version = "0.22", optional = true }
rand          = { version = "0.8", optional = true }
x25519-dalek  = { version = "2", optional = true, features = ["static_secrets"] }
hkdf          = { version = "0.12", optional = true }
aes-gcm       = { version = "0.10", optional = true }

[features]
default  = ["tokio"]
tokio    = ["dep:tokio", "reqwest/http2"]
signing  = ["dep:ed25519-dalek", "dep:sha2", "dep:base64", "dep:rand"]
chatcrypto = ["dep:x25519-dalek", "dep:hkdf", "dep:aes-gcm", "dep:sha2", "dep:base64", "dep:rand"]

[dev-dependencies]
tokio          = { version = "1", features = ["full"] }
wiremock       = "0.6"

[[test]]
name = "client_test"
required-features = ["signing"]
